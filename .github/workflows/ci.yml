name: AstraGraph CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Multi-Target net9.0;net10.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout RobustToolbox (commit from Compatibility.json)
        run: |
          ROBUST_COMMIT=$(python3 -c 'import json; print(json.load(open("Compatibility.json"))["testedRobustCommit"])')
          git init ../RobustToolbox
          cd ../RobustToolbox
          git remote add origin https://github.com/space-wizards/RobustToolbox.git
          git fetch --depth 1 origin "$ROBUST_COMMIT"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1
          cd ../AstraGraph

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AstraGraph.slnx

      - name: Build solution (Release)
        run: dotnet build AstraGraph.slnx --configuration Release -p:RobustToolsBuild=true --no-restore

      - name: Run tests (Release)
        run: dotnet test AstraGraph.slnx --configuration Release -p:RobustToolsBuild=true --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: AstraGraph.StudioWeb/package-lock.json

      - name: Test and build Astra Studio
        working-directory: AstraGraph.StudioWeb
        run: |
          npm ci
          npm test
          npm run build
          git -C .. diff --exit-code -- AstraGraph.StudioWeb/dist
          npx playwright install --with-deps chromium
          npm run e2e
          npm run e2e:live

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test_results.trx"
